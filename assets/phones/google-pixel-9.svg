<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p9-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="p9-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3440"/>
      <stop offset="50%" stop-color="#1e2530"/>
      <stop offset="100%" stop-color="#121720"/>
    </linearGradient>

    <linearGradient id="p9-wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="35%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="90%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <radialGradient id="p9-lens" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <filter id="p9-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- LEFT: Pixel 9 Back View (Iconic Pill Camera Visor) -->
  <g transform="translate(60, 25)" filter="url(#p9-shadow)">
    <!-- Aluminum Frame -->
    <rect x="0" y="0" width="160" height="330" rx="34" fill="url(#p9-frame)"/>
    <rect x="3" y="3" width="154" height="324" rx="31" fill="url(#p9-back)"/>

    <!-- Iconic Floating Visor Island (Raised pill shape) -->
    <rect x="10" y="32" width="140" height="48" rx="24" fill="#141a24" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Camera Oval Cutout -->
    <rect x="24" y="42" width="68" height="28" rx="14" fill="#000000"/>
    
    <!-- Lens 1 (Main 50MP) -->
    <circle cx="40" cy="56" r="10" fill="url(#p9-lens)"/>
    <circle cx="38" cy="54" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Lens 2 (Ultra-wide 48MP) -->
    <circle cx="76" cy="56" r="10" fill="url(#p9-lens)"/>
    <circle cx="74" cy="54" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Flash & Temperature Sensor -->
    <circle cx="120" cy="56" r="6" fill="#fffbe8" stroke="#475569" stroke-width="1"/>

    <!-- Google 'G' Logo -->
    <circle cx="80" cy="180" r="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  </g>

  <!-- RIGHT: Pixel 9 Front View (Actua OLED Display) -->
  <g transform="translate(230, 25)" filter="url(#p9-shadow)">
    <rect x="0" y="0" width="160" height="330" rx="34" fill="url(#p9-frame)"/>
    <rect x="2.5" y="2.5" width="155" height="325" rx="31.5" fill="#000000"/>
    <rect x="5" y="5" width="150" height="320" rx="29" fill="url(#p9-wallpaper)"/>

    <!-- Punch Hole Camera (Centered) -->
    <circle cx="80" cy="18" r="4" fill="#000000"/>
    <circle cx="80" cy="18" r="2.5" fill="#064e3b"/>

    <!-- Clock -->
    <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">10:00</text>
    <text x="80" y="105" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0" text-anchor="middle">Tue, Oct 15 • 72°F</text>
    
    <!-- Home Bar -->
    <rect x="60" y="316" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
