<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="s23-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Lavender Back -->
    <linearGradient id="s23-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="50%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <linearGradient id="s23-wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="40%" stop-color="#581c87"/>
      <stop offset="70%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <radialGradient id="s23-lens" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>

    <filter id="s23-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- LEFT: S23 Back (Lavender with 3 Floating Lenses) -->
  <g transform="translate(60, 25)" filter="url(#s23-shadow)">
    <rect x="0" y="0" width="160" height="330" rx="32" fill="url(#s23-frame)"/>
    <rect x="3" y="3" width="154" height="324" rx="29" fill="url(#s23-back)"/>

    <!-- Lens 1 -->
    <circle cx="34" cy="40" r="14" fill="#a78bfa"/>
    <circle cx="34" cy="40" r="11" fill="url(#s23-lens)"/>
    <circle cx="31" cy="37" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Lens 2 -->
    <circle cx="34" cy="76" r="14" fill="#a78bfa"/>
    <circle cx="34" cy="76" r="11" fill="url(#s23-lens)"/>
    <circle cx="31" cy="73" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Lens 3 -->
    <circle cx="34" cy="112" r="14" fill="#a78bfa"/>
    <circle cx="34" cy="112" r="11" fill="url(#s23-lens)"/>
    <circle cx="31" cy="109" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Flash -->
    <circle cx="60" cy="40" r="5" fill="#fffbe8" stroke="#a78bfa" stroke-width="1"/>

    <text x="80" y="295" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#6d28d9" opacity="0.4" text-anchor="middle" letter-spacing="2">SAMSUNG</text>
  </g>

  <!-- RIGHT: S23 Front -->
  <g transform="translate(230, 25)" filter="url(#s23-shadow)">
    <rect x="0" y="0" width="160" height="330" rx="32" fill="url(#s23-frame)"/>
    <rect x="2.5" y="2.5" width="155" height="325" rx="29.5" fill="#000000"/>
    <rect x="5" y="5" width="150" height="320" rx="27" fill="url(#s23-wallpaper)"/>

    <circle cx="80" cy="18" r="4" fill="#000000"/>
    <circle cx="80" cy="18" r="2.5" fill="#2e1065"/>

    <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">12:45</text>
    <rect x="60" y="316" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>

