<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Titanium Edge Gradients -->
    <linearGradient id="ti-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c8b8"/>
      <stop offset="25%" stop-color="#9a9082"/>
      <stop offset="50%" stop-color="#e8ded0"/>
      <stop offset="75%" stop-color="#70685e"/>
      <stop offset="100%" stop-color="#b0a597"/>
    </linearGradient>

    <!-- Blue Titanium Edge -->
    <linearGradient id="ti-blue-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a658a"/>
      <stop offset="35%" stop-color="#1f2d42"/>
      <stop offset="70%" stop-color="#5a7a9e"/>
      <stop offset="100%" stop-color="#152030"/>
    </linearGradient>

    <!-- Natural Titanium Back Glass -->
    <linearGradient id="ti-back" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9e9385"/>
      <stop offset="40%" stop-color="#84796c"/>
      <stop offset="100%" stop-color="#5c5348"/>
    </linearGradient>

    <!-- Blue Titanium Back Glass -->
    <linearGradient id="ti-blue-back" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2c3e55"/>
      <stop offset="50%" stop-color="#1a2738"/>
      <stop offset="100%" stop-color="#0f1926"/>
    </linearGradient>

    <!-- Dynamic Island Screen Wallpaper -->
    <linearGradient id="screen-art" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="30%" stop-color="#1b263b"/>
      <stop offset="55%" stop-color="#415a77"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="90%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Sapphire Lens Ring Reflection -->
    <radialGradient id="lens-glint" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Camera Module Elevation Shadow -->
    <filter id="module-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="phone-ambient-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="-10" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- BACKGROUND PHONE (Angled Front Facing Screen) -->
  <g transform="translate(130, 40) rotate(-14) scale(0.92)" filter="url(#phone-ambient-shadow)">
    <!-- Outer Titanium Bezel -->
    <rect x="0" y="0" width="280" height="570" rx="52" fill="url(#ti-blue-edge)"/>
    <!-- Black Screen Border -->
    <rect x="5" y="5" width="270" height="560" rx="48" fill="#000000"/>
    <!-- OLED Screen Area -->
    <rect x="10" y="10" width="260" height="550" rx="44" fill="url(#screen-art)"/>
    
    <!-- Screen Glass Sheen -->
    <path d="M10 10 L270 10 L10 480 Z" fill="white" opacity="0.04"/>

    <!-- Dynamic Island Pill -->
    <rect x="90" y="24" width="100" height="30" rx="15" fill="#000000"/>
    <!-- Selfie Lens & Sensor -->
    <circle cx="165" cy="39" r="6.5" fill="#0b132b"/>
    <circle cx="166" cy="38" r="2" fill="#38bdf8" opacity="0.6"/>

    <!-- Screen Time & Widgets (Subtle Tech Aesthetic) -->
    <text x="140" y="130" font-family="-apple-system, sans-serif" font-size="54" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.95">9:41</text>
    <text x="140" y="165" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">TUESDAY, SEPTEMBER 24</text>
    
    <!-- Home Bar Indicator -->
    <rect x="95" y="546" width="90" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- FOREGROUND PHONE (Magnificent Titanium Back View with Triple Camera Array) -->
  <g transform="translate(260, 20) rotate(8)" filter="url(#phone-ambient-shadow)">
    <!-- Grade 5 Titanium Outer Frame -->
    <rect x="0" y="0" width="285" height="580" rx="54" fill="url(#ti-edge)"/>
    <!-- Titanium Polished Edge Chamfer -->
    <rect x="3" y="3" width="279" height="574" rx="51" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Back Frosted Glass Plate -->
    <rect x="6" y="6" width="273" height="568" rx="48" fill="url(#ti-back)"/>
    
    <!-- Frosted Texture Grain Highlight -->
    <path d="M6 6 Q 140 280 279 574 L 6 574 Z" fill="white" opacity="0.03"/>

    <!-- Camera Plateau (Frosted Glass Module Island) -->
    <rect x="22" y="24" width="138" height="145" rx="34" fill="url(#ti-edge)" opacity="0.3" filter="url(#module-shadow)"/>
    <rect x="24" y="26" width="134" height="141" rx="32" fill="#756b5f" opacity="0.85"/>
    <rect x="25" y="27" width="132" height="139" rx="31" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Lens 1 (Main Fusion 48MP - Top Left) -->
    <g transform="translate(38, 40)">
      <circle cx="28" cy="28" r="28" fill="#524b42"/>
      <circle cx="28" cy="28" r="26" fill="url(#ti-edge)"/>
      <circle cx="28" cy="28" r="23" fill="#181716"/>
      <circle cx="28" cy="28" r="19" fill="url(#lens-glint)"/>
      <circle cx="23" cy="23" r="5" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- Lens 2 (5x Telephoto Prism - Bottom Left) -->
    <g transform="translate(38, 102)">
      <circle cx="28" cy="28" r="28" fill="#524b42"/>
      <circle cx="28" cy="28" r="26" fill="url(#ti-edge)"/>
      <circle cx="28" cy="28" r="23" fill="#181716"/>
      <circle cx="28" cy="28" r="19" fill="url(#lens-glint)"/>
      <circle cx="23" cy="23" r="5" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- Lens 3 (48MP Ultra-Wide - Center Right) -->
    <g transform="translate(95, 71)">
      <circle cx="28" cy="28" r="28" fill="#524b42"/>
      <circle cx="28" cy="28" r="26" fill="url(#ti-edge)"/>
      <circle cx="28" cy="28" r="23" fill="#181716"/>
      <circle cx="28" cy="28" r="19" fill="url(#lens-glint)"/>
      <circle cx="23" cy="23" r="5" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- True Tone Flash -->
    <circle cx="123" cy="46" r="11" fill="#fffbe8" stroke="#877d71" stroke-width="2"/>
    <circle cx="123" cy="46" r="8" fill="#fef08a" opacity="0.7"/>

    <!-- LiDAR Scanner Sensor -->
    <circle cx="123" cy="125" r="9" fill="#090a0f" stroke="#4a443b" stroke-width="1.5"/>

    <!-- Rear Microphone -->
    <circle cx="138" cy="98" r="3" fill="#1c1b18"/>

    <!-- Subtle Polished Apple Logo -->
    <path d="M142.5 282.8 c-4.8 0-9.8-2.6-13.6-2.6-3.8 0-8.5 2.5-12.8 2.5-10.4 0-21.5-8.8-21.5-25.2 0-16.1 10.5-24.7 20.8-24.7 5.2 0 9.8 2.8 13.5 2.8 3.5 0 8.8-2.9 14.7-2.9 2.5 0 11.2 0.4 17.2 9.2-0.5 0.3-10.3 6-10.3 18.2 0 14.5 12.8 19.6 13 19.7-0.1 0.5-2 6.9-6.7 13.7-4.1 5.9-8.3 11.8-14.3 11.8z M137.9 231.9 c2.7-3.3 4.6-7.8 4.6-12.4 0-0.6-0.1-1.3-0.2-1.9-4.4 0.2-9.6 3-12.7 6.6-2.4 2.8-4.5 7.4-4.5 12.1 0 0.7 0.1 1.4 0.2 1.6 0.3 0 1.2 0.1 2.2 0.1 4.1 0 8-2.7 10.4-6.1z" fill="white" opacity="0.28"/>
  </g>
</svg>
