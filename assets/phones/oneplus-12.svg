<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="op-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#166534"/>
      <stop offset="80%" stop-color="#0f3d20"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Flowy Emerald Back -->
    <linearGradient id="op-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5c3c"/>
      <stop offset="50%" stop-color="#14462d"/>
      <stop offset="100%" stop-color="#0b2e1d"/>
    </linearGradient>

    <!-- OxygenOS Flowing Wallpaper -->
    <linearGradient id="op-wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <radialGradient id="op-lens" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021a12"/>
    </radialGradient>

    <filter id="op-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- LEFT: OnePlus 12 Back View (Circular Hasselblad Module) -->
  <g transform="translate(60, 25)" filter="url(#op-shadow)">
    <!-- Aluminum Curved Frame -->
    <rect x="0" y="0" width="160" height="330" rx="34" fill="url(#op-frame)"/>
    <rect x="3" y="3" width="154" height="324" rx="31" fill="url(#op-back)"/>

    <!-- Circular Camera Dial (Merged into left frame) -->
    <circle cx="56" cy="70" r="44" fill="#0d281a" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="56" cy="70" r="40" fill="#061a10"/>

    <!-- 4 Lenses in Grid -->
    <circle cx="42" cy="56" r="12" fill="url(#op-lens)"/>
    <circle cx="40" cy="54" r="2.5" fill="#ffffff" opacity="0.6"/>

    <circle cx="70" cy="56" r="12" fill="url(#op-lens)"/>
    <circle cx="68" cy="54" r="2.5" fill="#ffffff" opacity="0.6"/>

    <circle cx="42" cy="84" r="12" fill="url(#op-lens)"/>
    <circle cx="40" cy="82" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Hasselblad 'H' Logo in 4th slot -->
    <circle cx="70" cy="84" r="10" fill="#0f3d20"/>
    <text x="70" y="88" font-family="serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.6" text-anchor="middle">H</text>

    <!-- Flash -->
    <circle cx="20" cy="24" r="5" fill="#fffbe8" stroke="#166534" stroke-width="1"/>

    <!-- OnePlus Logo Center -->
    <rect x="74" y="180" width="12" height="12" rx="2" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="80" y="189" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" fill="rgba(255,255,255,0.3)" text-anchor="middle">1+</text>
  </g>

  <!-- RIGHT: OnePlus 12 Front View (Curved AMOLED Display) -->
  <g transform="translate(230, 25)" filter="url(#op-shadow)">
    <rect x="0" y="0" width="160" height="330" rx="34" fill="url(#op-frame)"/>
    <rect x="2.5" y="2.5" width="155" height="325" rx="31.5" fill="#000000"/>
    <rect x="5" y="5" width="150" height="320" rx="29" fill="url(#op-wallpaper)"/>

    <!-- Punch Hole Camera (Centered) -->
    <circle cx="80" cy="18" r="4" fill="#000000"/>
    <circle cx="80" cy="18" r="2.5" fill="#065f46"/>

    <!-- Clock -->
    <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">10:08</text>
    
    <!-- Home Bar -->
    <rect x="60" y="316" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>

