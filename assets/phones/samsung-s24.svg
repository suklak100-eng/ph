<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Armor Aluminum Edge -->
    <linearGradient id="s24-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4d53"/>
      <stop offset="35%" stop-color="#2a2c30"/>
      <stop offset="70%" stop-color="#555860"/>
      <stop offset="100%" stop-color="#1f2024"/>
    </linearGradient>

    <!-- Phantom Black Matte Glass Back -->
    <linearGradient id="s24-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c30"/>
      <stop offset="50%" stop-color="#1e2024"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>

    <!-- Galaxy Mineral Crystal Wallpaper -->
    <linearGradient id="s24-wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="30%" stop-color="#312e81"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="85%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Camera Lens Reflection -->
    <radialGradient id="s24-lens" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <filter id="s24-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- LEFT: Galaxy S24 Back View (3 Floating Vertical Lenses) -->
  <g transform="translate(60, 25)" filter="url(#s24-shadow)">
    <!-- Aluminum Frame -->
    <rect x="0" y="0" width="160" height="330" rx="32" fill="url(#s24-frame)"/>
    <rect x="3" y="3" width="154" height="324" rx="29" fill="url(#s24-back)"/>

    <!-- Lens 1 (Top Floating Lens) -->
    <circle cx="34" cy="40" r="15" fill="#3f434a"/>
    <circle cx="34" cy="40" r="14" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <circle cx="34" cy="40" r="11" fill="url(#s24-lens)"/>
    <circle cx="30" cy="36" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Lens 2 (Middle Floating Lens) -->
    <circle cx="34" cy="78" r="15" fill="#3f434a"/>
    <circle cx="34" cy="78" r="14" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <circle cx="34" cy="78" r="11" fill="url(#s24-lens)"/>
    <circle cx="30" cy="74" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Lens 3 (Bottom Floating Lens) -->
    <circle cx="34" cy="116" r="15" fill="#3f434a"/>
    <circle cx="34" cy="116" r="14" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <circle cx="34" cy="116" r="11" fill="url(#s24-lens)"/>
    <circle cx="30" cy="112" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Flash on Right of First Lens -->
    <circle cx="62" cy="40" r="5" fill="#fffbe8" stroke="#4b5563" stroke-width="1"/>

    <!-- Subtle Samsung Logo -->
    <text x="80" y="295" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0.3" text-anchor="middle" letter-spacing="2">SAMSUNG</text>
  </g>

  <!-- RIGHT: Galaxy S24 Front View (Infinity-O Punch Hole Display) -->
  <g transform="translate(230, 25)" filter="url(#s24-shadow)">
    <!-- Aluminum Frame -->
    <rect x="0" y="0" width="160" height="330" rx="32" fill="url(#s24-frame)"/>
    <!-- Black Bezel -->
    <rect x="2.5" y="2.5" width="155" height="325" rx="29.5" fill="#000000"/>
    <!-- Dynamic AMOLED Screen -->
    <rect x="5" y="5" width="150" height="320" rx="27" fill="url(#s24-wallpaper)"/>

    <!-- Punch Hole Camera (Tiny, Centered) -->
    <circle cx="80" cy="18" r="4" fill="#000000"/>
    <circle cx="80" cy="18" r="2.5" fill="#0a0f1d"/>
    <circle cx="79.5" cy="17.5" r="1" fill="#60a5fa" opacity="0.7"/>

    <!-- Clock & Galaxy AI Sparkle Icon -->
    <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">12:45</text>
    
    <!-- Home Gesture Line -->
    <rect x="60" y="316" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>

