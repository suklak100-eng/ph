<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="i15-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0c8d8"/>
      <stop offset="50%" stop-color="#8baec4"/>
      <stop offset="100%" stop-color="#6a91ab"/>
    </linearGradient>

    <!-- Color-infused Pastel Blue Back Glass -->
    <linearGradient id="i15-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6e6f0"/>
      <stop offset="50%" stop-color="#c1d9e6"/>
      <stop offset="100%" stop-color="#abcadb"/>
    </linearGradient>

    <linearGradient id="i15-wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <radialGradient id="i15-lens" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <filter id="i15-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- LEFT: iPhone 15 Back (Dual Diagonal Cameras) -->
  <g transform="translate(60, 25)" filter="url(#i15-shadow)">
    <rect x="0" y="0" width="160" height="330" rx="36" fill="url(#i15-frame)"/>
    <rect x="3" y="3" width="154" height="324" rx="33" fill="url(#i15-back)"/>

    <!-- Camera Squircle Plateau -->
    <rect x="12" y="14" width="70" height="70" rx="20" fill="#a4c4d6" opacity="0.8" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

    <!-- Lens 1 (Top Left) -->
    <circle cx="32" cy="34" r="15" fill="url(#i15-frame)"/>
    <circle cx="32" cy="34" r="12" fill="url(#i15-lens)"/>
    <circle cx="29" cy="31" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Lens 2 (Bottom Right Diagonal) -->
    <circle cx="62" cy="64" r="15" fill="url(#i15-frame)"/>
    <circle cx="62" cy="64" r="12" fill="url(#i15-lens)"/>
    <circle cx="59" cy="61" r="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Flash (Top Right) -->
    <circle cx="62" cy="34" r="5" fill="#fffbe8" stroke="#8baec4" stroke-width="1"/>

    <!-- Mic (Bottom Left) -->
    <circle cx="32" cy="64" r="2.5" fill="#475569"/>

    <!-- Apple Logo -->
    <circle cx="80" cy="165" r="12" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"/>
  </g>

  <!-- RIGHT: iPhone 15 Front (Dynamic Island) -->
  <g transform="translate(230, 25)" filter="url(#i15-shadow)">
    <rect x="0" y="0" width="160" height="330" rx="36" fill="url(#i15-frame)"/>
    <rect x="2.5" y="2.5" width="155" height="325" rx="33.5" fill="#000000"/>
    <rect x="5.5" y="5.5" width="149" height="319" rx="30.5" fill="url(#i15-wallpaper)"/>

    <!-- Dynamic Island -->
    <rect x="54" y="14" width="52" height="16" rx="8" fill="#000000"/>
    <circle cx="94" cy="22" r="3" fill="#0b132b"/>

    <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">9:41</text>
    <rect x="55" y="316" width="50" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>

