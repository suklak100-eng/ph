<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nord-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Tempest Gray Back -->
    <linearGradient id="nord-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3440"/>
      <stop offset="50%" stop-color="#1e242c"/>
      <stop offset="100%" stop-color="#12161b"/>
    </linearGradient>

    <linearGradient id="nord-wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="nord-lens" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <filter id="nord-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- LEFT: Nord 3 Back (Dual Independent Circles) -->
  <g transform="translate(60, 25)" filter="url(#nord-shadow)">
    <rect x="0" y="0" width="160" height="330" rx="34" fill="url(#nord-frame)"/>
    <rect x="3" y="3" width="154" height="324" rx="31" fill="url(#nord-back)"/>

    <!-- Camera Ring 1 (Top 50MP Sony IMX890) -->
    <circle cx="36" cy="45" r="18" fill="#18202b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="36" cy="45" r="14" fill="url(#nord-lens)"/>
    <circle cx="33" cy="42" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Camera Ring 2 (Bottom Dual Sensors) -->
    <circle cx="36" cy="95" r="18" fill="#18202b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="30" cy="95" r="7" fill="url(#nord-lens)"/>
    <circle cx="42" cy="95" r="7" fill="url(#nord-lens)"/>

    <!-- Dual Flash on Right -->
    <circle cx="70" cy="45" r="5" fill="#fffbe8" stroke="#475569" stroke-width="1"/>
    <circle cx="70" cy="95" r="5" fill="#fffbe8" stroke="#475569" stroke-width="1"/>

    <!-- OnePlus Logo Center -->
    <rect x="74" y="180" width="12" height="12" rx="2" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="80" y="189" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" fill="rgba(255,255,255,0.3)" text-anchor="middle">1+</text>
  </g>

  <!-- RIGHT: Nord 3 Front -->
  <g transform="translate(230, 25)" filter="url(#nord-shadow)">
    <rect x="0" y="0" width="160" height="330" rx="34" fill="url(#nord-frame)"/>
    <rect x="2.5" y="2.5" width="155" height="325" rx="31.5" fill="#000000"/>
    <rect x="5" y="5" width="150" height="320" rx="29" fill="url(#nord-wallpaper)"/>

    <circle cx="80" cy="18" r="4" fill="#000000"/>
    <circle cx="80" cy="18" r="2.5" fill="#0f172a"/>

    <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">10:08</text>
    <rect x="60" y="316" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>

